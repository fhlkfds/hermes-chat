name: windows-installer

# On a v<version> tag it also attaches the installer to that tag's GitHub release (ADR 0080).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "scripts/release/windows-release*.sh"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --lib
        working-directory: src-tauri
        env:
          RUSTFLAGS: ""
      - name: Build the NSIS installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-chat-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: nsis
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hermes-chat-windows-nsis
          path: ${{ runner.temp }}/nsis
      - name: Check the release script
        run: scripts/release/windows-release.test.sh
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release/windows-release.sh "$RUNNER_TEMP/nsis" "$GITHUB_REF_NAME"
