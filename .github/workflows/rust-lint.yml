# Temporary: runs clippy and cargo fmt --check on a runner, for a PC without a Rust toolchain.
name: rust-lint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist out
      - run: rustc --version > ../out/versions.txt && cargo clippy --version >> ../out/versions.txt && cargo fmt --version >> ../out/versions.txt
        working-directory: src-tauri
      - name: clippy
        run: cargo clippy --all-targets --keep-going -- -D warnings > ../out/clippy.txt 2>&1 || echo "CLIPPY_FAILED=1" >> "$GITHUB_ENV"
        working-directory: src-tauri
      - name: fmt
        run: |
          cargo fmt --check > ../out/fmt-check.txt 2>&1 || echo "FMT_FAILED=1" >> "$GITHUB_ENV"
          cargo fmt
          git -C .. diff > ../out/fmt.patch
          git -C .. checkout -- .
        working-directory: src-tauri
      - run: cargo test --lib --test transport --test media --test screenshot --test update > ../out/test.txt 2>&1 || echo "TEST_FAILED=1" >> "$GITHUB_ENV"
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-lint
          path: out
      - name: verdict
        run: |
          echo "clippy failed: ${CLIPPY_FAILED:-0}; fmt check failed: ${FMT_FAILED:-0}; tests failed: ${TEST_FAILED:-0}"
          test -z "$CLIPPY_FAILED" && test -z "$FMT_FAILED" && test -z "$TEST_FAILED"
