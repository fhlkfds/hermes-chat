# Temporary: runs clippy and cargo fmt on a runner and uploads the fmt diffs, for a PC without a Rust toolchain.
name: rust-lint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist out
      - run: rustc --version > ../out/versions.txt && cargo clippy --version >> ../out/versions.txt && cargo fmt --version >> ../out/versions.txt
        working-directory: src-tauri
      - name: clippy
        run: cargo clippy --all-targets --keep-going -- -D warnings > ../out/clippy.txt 2>&1 || echo "CLIPPY_FAILED=1" >> "$GITHUB_ENV"
        working-directory: src-tauri
      - name: fmt
        run: |
          cargo fmt --check > ../out/fmt-check.txt 2>&1 || echo "FMT_FAILED=1" >> "$GITHUB_ENV"
          for w in 100 120 140 160 180 200; do
            for h in Default Max; do
              printf 'max_width = %s\nuse_small_heuristics = "%s"\n' "$w" "$h" > rustfmt.toml
              cargo fmt
              rm rustfmt.toml
              echo "width $w heuristics $h: $(git -C .. diff --shortstat)" >> ../out/summary.txt
              git -C .. diff > "../out/fmt-$w-$h.patch"
              git -C .. checkout -- .
            done
          done
          cat ../out/summary.txt
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-lint
          path: out
      - name: verdict
        run: |
          echo "clippy failed: ${CLIPPY_FAILED:-0}; fmt check failed: ${FMT_FAILED:-0}"
          test -z "$CLIPPY_FAILED" && test -z "$FMT_FAILED"
